<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sổ Lên Đơn Premium</title>
  
  <!-- CSS Tailwind và các thư viện hỗ trợ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.12.12/babel.min.js"></script>
  
  <!-- SheetJS để đọc/xuất Excel & html2canvas để xuất ảnh hóa đơn -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
    
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 100%);
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }

    /* Thiết kế Glassmorphism nâng cao */
    .premium-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.05), 0 8px 16px -6px rgba(0, 0, 0, 0.02);
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .premium-card:hover {
      box-shadow: 0 20px 35px -10px rgba(16, 185, 129, 0.08), 0 10px 20px -8px rgba(0, 0, 0, 0.03);
    }

    /* Thanh điều hướng chân trang */
    .modern-nav {
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.04);
      backdrop-filter: blur(16px);
    }

    /* Định dạng nút bấm tương tác */
    .btn-bounce {
      transition: transform 0.1s ease;
    }
    .btn-bounce:active {
      transform: scale(0.96);
    }

    /* Ẩn thanh cuộn trình duyệt */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Cấu trúc hóa đơn nhiệt chân thực */
    .receipt-container {
      background-color: #ffffff;
      color: #111827;
      font-family: 'Space Grotesk', 'Courier New', monospace;
      position: relative;
    }
    
    .receipt-serrated-top {
      position: relative;
      height: 12px;
      background-color: #ffffff;
    }
    .receipt-serrated-top::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 12px;
      background-size: 16px 12px;
      background-repeat: repeat-x;
      background-image: linear-gradient(45deg, transparent 33.333%, #f1f5f9 33.333%, #f1f5f9 66.667%, transparent 66.667%),
                        linear-gradient(-45deg, transparent 33.333%, #f1f5f9 33.333%, #f1f5f9 66.667%, transparent 66.667%);
    }

    .receipt-serrated-bottom {
      position: relative;
      height: 12px;
      background-color: #ffffff;
    }
    .receipt-serrated-bottom::before {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 12px;
      background-size: 16px 12px;
      background-repeat: repeat-x;
      background-image: linear-gradient(45deg, #ffffff 33.333%, transparent 33.333%, transparent 66.667%, #ffffff 66.667%),
                        linear-gradient(-45deg, #ffffff 33.333%, transparent 33.333%, transparent 66.667%, #ffffff 66.667%);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="antialiased text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_NAME = "SỔ LÊN ĐƠN";
    const APP_VERSION = "v3.0 Premium";
    const STORAGE_KEY = "premium_pos_local_data_v3";
    const SETTINGS_KEY = "premium_pos_local_settings_v3";

    const seedProducts = [
      { id: 1, name: "Yến sào chưng đường phèn (Hũ 70ml)", price: 45000, stock: 150 },
      { id: 2, name: "Đông trùng hạ thảo sấy thăng hoa (Hộp 25g)", price: 420000, stock: 45 },
      { id: 3, name: "Mật ong bạc hà nguyên chất (Chai 1 lít)", price: 350000, stock: 30 },
      { id: 4, name: "Nhân sâm tươi Hàn Quốc (Hộp 6 củ)", price: 1850000, stock: 12 },
      { id: 5, name: "Trà hoa cúc tiến vua sấy lạnh (Hộp 100g)", price: 125000, stock: 80 }
    ];

    const seedCustomers = [
      { id: 1, name: "Khách lẻ tại quầy", note: "Khách vãng lai mua trực tiếp" },
      { id: 2, name: "Chị Ngọc Mai", note: "SĐT: 0987 654 321 | Địa chỉ: 12 Cầu Giấy, HN" },
      { id: 3, name: "Anh Minh Quân", note: "SĐT: 0905 111 222 | Khách sỉ chiết khấu cao" }
    ];

    const seedSales = [
      {
        id: 2026001,
        customer: "Chị Ngọc Mai",
        note: "Giao giờ hành chính, gọi trước 15 phút",
        total: 440000,
        date: new Date().toISOString(),
        items: [
          { id: "item_1", productId: 1, name: "Yến sào chưng đường phèn (Hũ 70ml)", qty: 2, originalPrice: 45000, appliedPrice: 45000, discountPercent: 0, note: "Vị hạt sen" },
          { id: "item_2", productId: 3, name: "Mật ong bạc hà nguyên chất (Chai 1 lít)", qty: 1, originalPrice: 350000, appliedPrice: 350000, discountPercent: 0, note: "" }
        ]
      }
    ];

    const defaultSettings = {
      storeName: "ORGANIC FOODS",
      subtitle: "Dinh Dưỡng & Sức Khỏe Cao Cấp",
      address: "102 Nguyễn Chí Thanh, Đống Đa, Hà Nội",
      phone: "0966 888 999",
      appsScriptUrl: "",
      currencySymbol: "đ",
      qrBankName: "Vietcombank",
      qrAccountNo: "1018889999",
      qrAccountName: "NGUYEN VAN A"
    };

    const formatCurrency = (n) => `${Number(n || 0).toLocaleString("vi-VN")}đ`;
    const formatNumber = (n) => Number(n || 0).toLocaleString("vi-VN");
    const generateOrderCode = (id) => `HD-${String(id || Date.now()).slice(-6).toUpperCase()}`;

    const splitProductSpec = (fullName) => {
      const match = String(fullName || "").match(/^(.*?)\s*\(([^)]+)\)\s*$/);
      if (match) {
        return { name: match[1].trim(), spec: `(${match[2].trim()})` };
      }
      return { name: fullName, spec: "" };
    };

    const safeStorageRead = (key, fallback) => {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    };

    const Icons = {
      Store: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
          <path d="m2 22 1-12h18l1 12" /><path d="M12 2a15.3 15.3 0 0 1 4 10H8a15.3 15.3 0 0 1 4-10z" /><path d="M12 12V2" /><path d="M2 10s3-3 10-3 10 3 10 3" />
        </svg>
      ),
      Chart: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
          <line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" />
        </svg>
      ),
      Sliders: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
          <line x1="4" y1="21" x2="4" y2="14" /><line x1="4" y1="10" x2="4" y2="3" /><line x1="12" y1="21" x2="12" y2="12" /><line x1="12" y1="8" x2="12" y2="3" /><line x1="20" y1="21" x2="20" y2="16" /><line x1="20" y1="12" x2="20" y2="3" /><line x1="1" y1="14" x2="7" y2="14" /><line x1="9" y1="8" x2="15" y2="8" /><line x1="17" y1="16" x2="23" y2="16" />
        </svg>
      ),
      Plus: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
          <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      ),
      Trash: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
          <polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      ),
      Search: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
          <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      ),
      CloudSync: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 animate-pulse">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" /><path d="M12 11v6" /><path d="m9 14 3-3 3 3" />
        </svg>
      ),
      Eye: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
        </svg>
      ),
      Copy: () => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      )
    };

    function App() {
      const [data, setData] = useState(() => safeStorageRead(STORAGE_KEY, {
        products: seedProducts,
        customers: seedCustomers,
        sales: seedSales
      }));
      const [settings, setSettings] = useState(() => safeStorageRead(SETTINGS_KEY, defaultSettings));
      const [view, setView] = useState("pos"); // Tabs: pos, report, settings
      
      const [cart, setCart] = useState([]);
      const [customer, setCustomer] = useState("Khách lẻ tại quầy");
      const [orderNote, setOrderNote] = useState("");
      const [searchProd, setSearchProd] = useState("");
      const [searchCust, setSearchCust] = useState("");
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [popupQty, setPopupQty] = useState(1);
      const [popupNote, setPopupNote] = useState("");
      
      const [showAddCust, setShowAddCust] = useState(false);
      const [showAddProd, setShowAddProd] = useState(false);
      const [newCust, setNewCust] = useState({ name: "", note: "" });
      const [newProd, setNewProd] = useState({ name: "", price: "", stock: 10 });

      const [showBill, setShowBill] = useState(false);
      const [billImage, setBillImage] = useState(null);
      const [billPreviewData, setBillPreviewData] = useState(null);
      const [renderingBill, setRenderingBill] = useState(false);

      const [reportFilter, setReportFilter] = useState("today"); // today, month, year, custom
      const [customDate, setCustomDate] = useState({ start: "", end: "" });
      const [editingOrderId, setEditingOrderId] = useState(null);

      const [syncingGoogle, setSyncingGoogle] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState("");
      const [importJsonText, setImportJsonText] = useState("");
      const [productImportMode, setProductImportMode] = useState("append");
      const [customerImportMode, setCustomerImportMode] = useState("append");
      const [showAppsScriptGuide, setShowAppsScriptGuide] = useState(false);

      const [toasts, setToasts] = useState([]);

      const receiptRef = useRef(null);
      const fileInputProductRef = useRef(null);
      const fileInputCustomerRef = useRef(null);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }, [data]);

      useEffect(() => {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      }, [settings]);

      const triggerToast = (msg, type = "success") => {
        const id = Date.now();
        setToasts((prev) => [...prev, { id, msg, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3200);
      };

      const products = data.products || [];
      const customers = data.customers || [];
      const sales = data.sales || [];

      const parseDiscountFromNote = (price, note) => {
        const match = String(note || "").match(/(giảm|chiết khấu|ck)\s*(\d+)\s*%/i);
        if (match) {
          const percent = Math.min(100, Math.max(0, Number(match[2])));
          const finalPrice = Math.round(Number(price) * (1 - percent / 100));
          return { finalPrice, percent };
        }
        return { finalPrice: Number(price), percent: 0 };
      };

      const filteredProducts = useMemo(() => {
        return products.filter((p) => p.name.toLowerCase().includes(searchProd.toLowerCase()));
      }, [products, searchProd]);

      const filteredCustomers = useMemo(() => {
        return customers.filter((c) => c.name.toLowerCase().includes(searchCust.toLowerCase()));
      }, [customers, searchCust]);

      const cartTotalAmount = useMemo(() => {
        return cart.reduce((sum, item) => sum + item.appliedPrice * item.qty, 0);
      }, [cart]);

      const salesStats = useMemo(() => {
        const now = new Date();
        const filtered = sales.filter((sale) => {
          const saleDate = new Date(sale.date);
          if (reportFilter === "today") return saleDate.toDateString() === now.toDateString();
          if (reportFilter === "month") return saleDate.getMonth() === now.getMonth() && saleDate.getFullYear() === now.getFullYear();
          if (reportFilter === "year") return saleDate.getFullYear() === now.getFullYear();
          if (reportFilter === "custom" && customDate.start && customDate.end) {
            const start = new Date(customDate.start);
            start.setHours(0,0,0,0);
            const end = new Date(customDate.end);
            end.setHours(23,59,59,999);
            return saleDate >= start && saleDate <= end;
          }
          return true;
        });

        const revenue = filtered.reduce((sum, s) => sum + Number(s.total || 0), 0);
        const orderCount = filtered.length;
        const totalItemsSold = filtered.reduce((sum, s) => sum + s.items.reduce((acc, i) => acc + Number(i.qty || 0), 0), 0);
        
        return { revenue, orderCount, totalItemsSold, orders: filtered };
      }, [sales, reportFilter, customDate]);

      const topSellingProducts = useMemo(() => {
        const counts = {};
        salesStats.orders.forEach((sale) => {
          sale.items.forEach((item) => {
            counts[item.name] = (counts[item.name] || 0) + Number(item.qty || 0);
          });
        });
        return Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);
      }, [salesStats]);

      const handleCreateCustomer = () => {
        if (!newCust.name.trim()) {
          triggerToast("Tên khách hàng không được để trống!", "error");
          return;
        }
        const created = { id: Date.now(), name: newCust.name.trim(), note: newCust.note.trim() };
        setData((prev) => ({
          ...prev,
          customers: [created, ...prev.customers]
        }));
        setCustomer(created.name);
        setOrderNote(created.note);
        setNewCust({ name: "", note: "" });
        setShowAddCust(false);
        triggerToast("Đã thêm và chọn khách hàng!");
      };

      const handleCreateProduct = () => {
        if (!newProd.name.trim() || !newProd.price) {
          triggerToast("Hãy điền tên và giá bán hợp lệ!", "error");
          return;
        }
        const created = {
          id: Date.now(),
          name: newProd.name.trim(),
          price: Number(newProd.price),
          stock: Number(newProd.stock || 0)
        };
        setData((prev) => ({
          ...prev,
          products: [created, ...prev.products]
        }));
        setNewProd({ name: "", price: "", stock: 10 });
        setShowAddProd(false);
        triggerToast("Thêm sản phẩm thành công!");
      };

      const handleAddProductToCart = () => {
        if (!selectedProduct) return;
        const qty = Math.max(1, Number(popupQty || 1));
        const { finalPrice, percent } = parseDiscountFromNote(selectedProduct.price, popupNote);

        const newItem = {
          id: Date.now(),
          productId: selectedProduct.id,
          name: selectedProduct.name,
          qty,
          note: popupNote.trim(),
          originalPrice: Number(selectedProduct.price),
          appliedPrice: Number(finalPrice),
          discountPercent: percent
        };

        setCart((prev) => [...prev, newItem]);
        setSelectedProduct(null);
        setPopupQty(1);
        setPopupNote("");
        triggerToast("Đã thêm vào giỏ hàng!");
      };

      const changeCartItemQty = (id, delta) => {
        setCart((prev) =>
          prev.map((item) => {
            if (item.id === id) {
              const nextQty = Math.max(1, item.qty + delta);
              return { ...item, qty: nextQty };
            }
            return item;
          })
        );
      };

      const removeCartItem = (id) => {
        setCart((prev) => prev.filter((item) => item.id !== id));
        triggerToast("Đã xóa mặt hàng khỏi giỏ!");
      };

      const handleResetForm = () => {
        setCart([]);
        setCustomer("Khách lẻ tại quầy");
        setOrderNote("");
        setEditingOrderId(null);
      };

      const handleDuplicateOrder = (sale) => {
        setCart(sale.items.map((i, idx) => ({ ...i, id: Date.now() + idx })));
        setCustomer(sale.customer || "Khách lẻ tại quầy");
        setOrderNote(sale.note || "");
        setEditingOrderId(null);
        setView("pos");
        triggerToast("Đã sao chép cấu trúc đơn hàng!");
      };

      const handleStartEditOrder = (sale) => {
        setCart(sale.items.map((i, idx) => ({ ...i, id: Date.now() + idx })));
        setCustomer(sale.customer || "Khách lẻ tại quầy");
        setOrderNote(sale.note || "");
        setEditingOrderId(sale.id);
        setView("pos");
        triggerToast(`Đang sửa hóa đơn ${generateOrderCode(sale.id)}`);
      };

      const handleCancelEdit = () => {
        handleResetForm();
        triggerToast("Đã hủy chế độ chỉnh sửa đơn.");
      };

      const handleSaveAndPrint = async () => {
        if (!cart.length) {
          triggerToast("Giỏ hàng trống, không thể lưu!", "error");
          return;
        }

        const targetId = editingOrderId || Date.now();
        const savedOrder = {
          id: targetId,
          customer: customer.trim() || "Khách lẻ tại quầy",
          note: orderNote.trim(),
          total: cartTotalAmount,
          date: editingOrderId ? (sales.find(s => s.id === editingOrderId)?.date || new Date().toISOString()) : new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          items: cart.map(i => ({ ...i }))
        };

        setData((prev) => {
          const nextSales = editingOrderId
            ? prev.sales.map((s) => (s.id === editingOrderId ? savedOrder : s))
            : [...prev.sales, savedOrder];
          return { ...prev, sales: nextSales };
        });

        setBillPreviewData(savedOrder);
        handleResetForm();
        triggerToast(editingOrderId ? "Cập nhật đơn hàng thành công!" : "Lưu đơn hàng thành công!");
        
        setRenderingBill(true);
        setShowBill(true);
        await new Promise((res) => setTimeout(res, 350));
        
        try {
          const canvas = await html2canvas(receiptRef.current, {
            scale: 2.0,
            backgroundColor: "#ffffff",
            useCORS: true
          });
          setBillImage(canvas.toDataURL("image/png"));
        } catch (e) {
          console.error("Lỗi xuất hóa đơn:", e);
          triggerToast("Không thể kết xuất ảnh hóa đơn!", "error");
        } finally {
          setRenderingBill(false);
        }
      };

      const handleViewHistoryInvoice = async (sale) => {
        setBillPreviewData(sale);
        setRenderingBill(true);
        setShowBill(true);
        await new Promise((res) => setTimeout(res, 350));
        
        try {
          const canvas = await html2canvas(receiptRef.current, {
            scale: 2.0,
            backgroundColor: "#ffffff",
            useCORS: true
          });
          setBillImage(canvas.toDataURL("image/png"));
        } catch (e) {
          console.error(e);
        } finally {
          setRenderingBill(false);
        }
      };

      const handlePullFromSheets = async () => {
        const url = settings.appsScriptUrl.trim();
        if (!url) {
          triggerToast("Hãy thiết lập URL Google Apps Script trong Cài đặt!", "error");
          setView("settings");
          return;
        }

        setSyncingGoogle(true);
        try {
          const reqUrl = `${url}${url.includes("?") ? "&" : "?"}action=getAll`;
          const response = await fetch(reqUrl, { method: "GET" });
          if (!response.ok) throw new Error("Yêu cầu không phản hồi tốt từ Sheets.");
          
          const result = await response.json();
          if (result && (result.products || result.customers || result.sales)) {
            setData({
              products: Array.isArray(result.products) ? result.products : [],
              customers: Array.isArray(result.customers) ? result.customers : [],
              sales: Array.isArray(result.sales) ? result.sales : []
            });

function doGet(e) {
  var action = e.parameter.action;
  var sheet = SpreadsheetApp.getActiveSpreadsheet();
  
  if (action == "getAll") {
    var result = { products: [], customers: [], sales: [], settings: {} };
    
    // Đọc Sản phẩm
    var pSheet = sheet.getSheetByName("Products") || initSheet(sheet, "Products", ["ID", "Tên sản phẩm", "Giá", "Tồn kho"]);
    var pData = pSheet.getDataRange().getValues();
    for(var i = 1; i < pData.length; i++) {
      if(pData[i][1]) {
        result.products.push({ id: pData[i][0], name: pData[i][1], price: Number(pData[i][2]), stock: Number(pData[i][3]) });
      }
    }
    
    // Đọc Khách hàng
    var cSheet = sheet.getSheetByName("Customers") || initSheet(sheet, "Customers", ["ID", "Tên khách", "Ghi chú"]);
    var cData = cSheet.getDataRange().getValues();
    for(var i = 1; i < cData.length; i++) {
      if(cData[i][1]) {
        result.customers.push({ id: cData[i][0], name: cData[i][1], note: cData[i][2] });
      }
    }
    
    // Đọc Lịch sử Bán hàng
    var sSheet = sheet.getSheetByName("Sales") || initSheet(sheet, "Sales", ["ID", "Khách hàng", "Ghi chú đơn", "Tổng tiền", "Ngày tạo", "Chi tiết đơn"]);
    var sData = sSheet.getDataRange().getValues();
    for(var i = 1; i < sData.length; i++) {
      if(sData[i][0]) {
        result.sales.push({
          id: sData[i][0],
          customer: sData[i][1],
          note: sData[i][2],
          total: Number(sData[i][3]),
          date: sData[i][4],
          items: JSON.parse(sData[i][5] || "[]")
        });
      }
    }
    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var payload = JSON.parse(e.postData.contents);
    var action = payload.action;
    var sheet = SpreadsheetApp.getActiveSpreadsheet();
    
    if (action == "pushAll") {
      // Ghi đè Sản phẩm
      var pSheet = sheet.getSheetByName("Products") || initSheet(sheet, "Products", ["ID", "Tên sản phẩm", "Giá", "Tồn kho"]);
      pSheet.clearContents();
      pSheet.appendRow(["ID", "Tên sản phẩm", "Giá", "Tồn kho"]);
      payload.data.products.forEach(function(p) {
        pSheet.appendRow([p.id, p.name, p.price, p.stock]);
      });
      
      // Ghi đè Khách hàng
      var cSheet = sheet.getSheetByName("Customers") || initSheet(sheet, "Customers", ["ID", "Tên khách", "Ghi chú"]);
      cSheet.clearContents();
      cSheet.appendRow(["ID", "Tên khách", "Ghi chú"]);
      payload.data.customers.forEach(function(c) {
        cSheet.appendRow([c.id, c.name, c.note]);
      });
      
      // Ghi đè Lịch sử Sales
      var sSheet = sheet.getSheetByName("Sales") || initSheet(sheet, "Sales", ["ID", "Khách hàng", "Ghi chú đơn", "Tổng tiền", "Ngày tạo", "Chi tiết đơn"]);
      sSheet.clearContents();
      sSheet.appendRow(["ID", "Khách hàng", "Ghi chú đơn", "Tổng tiền", "Ngày tạo", "Chi tiết đơn"]);
      payload.data.sales.forEach(function(s) {
        sSheet.appendRow([s.id, s.customer, s.note, s.total, s.date, JSON.stringify(s.items)]);
      });
      
      return ContentService.createTextOutput(JSON.stringify({ status: "success", message: "Đã đồng bộ xong dữ liệu từ điện thoại!" }))
        .setMimeType(ContentService.MimeType.JSON);
    }
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function initSheet(ss, name, headers) {
  var s = ss.insertSheet(name);
  s.appendRow(headers);
  return s;
}`;

                  <input
                    type="number"
                    className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-xs font-bold focus:border-emerald-500"
                    placeholder="Giá bán lẻ (VNĐ) *"
                    value={newProd.price}
                    onChange={(e) => setNewProd((p) => ({ ...p, price: e.target.value }))}
                  />
                  <input
                    type="number"
                    className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none text-xs font-bold focus:border-emerald-500"
                    placeholder="Số lượng tồn kho ban đầu"
                    value={newProd.stock}
                    onChange={(e) => setNewProd((p) => ({ ...p, stock: e.target.value }))}
                  />
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={() => setShowAddProd(false)}
                    className="flex-1 py-3 text-slate-400 font-extrabold uppercase text-[10px]"
                  >
                    Hủy bỏ
                  </button>
                  <button
                    onClick={handleCreateProduct}
                    className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg uppercase text-[10px]"
                  >
                    Thêm mặt hàng
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Thiết lập Số lượng khi bấm chọn Sản phẩm */}
          {selectedProduct && (
            <div
              className="fixed inset-0 z-[120] bg-black/60 backdrop-blur-sm flex items-end p-4"
              onClick={() => setSelectedProduct(null)}
            >
              <div
                className="bg-white w-full max-w-sm mx-auto rounded-[2.5rem] p-6 space-y-4 shadow-2xl animate-slide-up"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="text-center space-y-1">
                  {(() => {
                    const { name, spec } = splitProductSpec(selectedProduct.name);
                    return (
                      <React.Fragment>
                        <h4 className="text-sm font-black text-slate-800 uppercase tracking-tight">{name}</h4>
                        {spec && <span className="text-xs text-emerald-600 italic font-bold">{spec}</span>}
                      </React.Fragment>
                    );
                  })()}
                  <span className="block text-emerald-700 font-black text-sm bg-emerald-50 rounded-full px-3 py-1.5 w-max mx-auto mt-2">
                    {formatCurrency(selectedProduct.price)}
                  </span>
                </div>

                <div className="space-y-4">
                  {/* Bàn phím tăng giảm */}
                  <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                    <button
                      onClick={() => setPopupQty(p => Math.max(1, p - 1))}
                      className="w-12 h-12 bg-white rounded-xl shadow-sm text-xl font-bold text-emerald-600 btn-bounce flex items-center justify-center"
                    >
                      -
                    </button>
                    <div className="text-center">
                      <span className="text-[8px] text-slate-400 font-black block uppercase tracking-wider mb-0.5">Số lượng mua</span>
                      <input
                        type="number"
                        className="w-16 bg-transparent text-center text-2xl font-black outline-none"
                        value={popupQty}
                        onChange={(e) => setPopupQty(Number(e.target.value))}
                      />
                    </div>
                    <button
                      onClick={() => setPopupQty(p => p + 1)}
                      className="w-12 h-12 bg-white rounded-xl shadow-sm text-xl font-bold text-emerald-600 btn-bounce flex items-center justify-center"
                    >
                      +
                    </button>
                  </div>

                  <div className="space-y-1">
                    <span className="text-[9px] text-slate-400 font-black uppercase tracking-wider ml-1">
                      Yêu cầu mặt hàng / Ưu đãi (VD: "giảm 10%")
                    </span>
                    <textarea
                      className="w-full p-3.5 bg-slate-50 rounded-2xl text-xs font-bold border border-slate-200 outline-none focus:border-emerald-500 resize-none"
                      rows="2.5"
                      placeholder="Ghi chú đóng gói hoặc áp dụng giảm %..."
                      value={popupNote}
                      onChange={(e) => setPopupNote(e.target.value)}
                    />
                  </div>
                </div>

                <button
                  onClick={handleAddProductToCart}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs btn-bounce shadow-lg shadow-emerald-600/10"
                >
                  Xác nhận thêm
                </button>
              </div>
            </div>
          )}

          {/* Modal Hiển thị Ảnh Hóa đơn */}
          {showBill && (
            <div className="fixed inset-0 z-[200] bg-slate-950/95 flex flex-col items-center justify-center p-4">
              {renderingBill || !billImage ? (
                <div className="text-center space-y-2">
                  <div className="w-10 h-10 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                  <p className="text-white text-xs font-bold animate-pulse">Đang kết xuất ảnh hóa đơn giấy nhiệt...</p>
                </div>
              ) : (
                <div className="w-full max-w-sm flex flex-col gap-4 animate-slide-up">
                  <div className="bg-white rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
                    <img src={billImage} className="w-full h-auto max-h-[65vh] object-contain" alt="Hóa đơn thanh toán" />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      onClick={handleDownloadInvoice}
                      className="py-3.5 bg-white text-slate-900 rounded-2xl font-black uppercase tracking-wider text-[11px] btn-bounce"
                    >
                      Tải ảnh PNG
                    </button>
                    <button
                      onClick={() => {
                        setShowBill(false);
                        setBillImage(null);
                        setBillPreviewData(null);
                      }}
                      className="py-3.5 bg-emerald-600 text-white rounded-2xl font-black uppercase tracking-wider text-[11px] btn-bounce"
                    >
                      Đóng
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Phần Tử HTML Ẩn ngoài màn hình để xuất ảnh */}
          <div className="fixed -left-[9999px] top-0">
            {billPreviewData && (
              <div
                ref={receiptRef}
                className="receipt-container w-[650px] min-h-[900px] p-8 flex flex-col"
              >
                <div className="receipt-serrated-top"></div>

                <div className="flex-1 bg-[#ffffff] px-6 py-4 flex flex-col">
                  
                  {/* Cửa hàng */}
                  <div className="text-center space-y-1.5 pb-4 border-b-2 border-dashed border-slate-300">
                    <h2 className="text-3xl font-black uppercase tracking-tight text-slate-900">
                      {settings.storeName}
                    </h2>
                    <p className="text-sm font-bold text-slate-600 uppercase">
                      {settings.subtitle}
                    </p>
                    <p className="text-xs font-bold text-slate-500">
                      Đ/c: {settings.address}
                    </p>
                    <p className="text-sm font-black text-slate-700">
                      Hotline: {settings.phone}
                    </p>
                  </div>

                  {/* Thông tin hóa đơn */}
                  <div className="py-5 text-left space-y-1.5">
                    <div className="flex justify-between items-center">
                      <span className="text-base font-bold text-slate-600">Hóa Đơn:</span>
                      <span className="text-lg font-black text-slate-900">
                        {generateOrderCode(billPreviewData.id)}
                      </span>
                    </div>
                    <div className="flex justify-between items-center">
                      <span className="text-base font-bold text-slate-600">Thời gian:</span>
                      <span className="text-sm font-bold text-slate-800">
                        {new Date(billPreviewData.date).toLocaleString("vi-VN")}
                      </span>
                    </div>
                    <div className="flex justify-between items-start pt-1.5 border-t border-slate-100">
                      <span className="text-base font-bold text-slate-600">Khách hàng:</span>
                      <span className="text-base font-black text-slate-900 text-right">
                        {billPreviewData.customer}
                      </span>
                    </div>
                    {billPreviewData.note && (
                      <div className="p-3 bg-slate-50 rounded-xl mt-2">
                        <span className="text-xs font-bold text-slate-500 uppercase block mb-0.5">Yêu cầu / Giao nhận:</span>
                        <p className="text-xs font-bold text-slate-800 leading-relaxed whitespace-pre-line">
                          {billPreviewData.note}
                        </p>
                      </div>
                    )}
                  </div>

                  {/* Chi tiết mặt hàng */}
                  <div className="border-t-2 border-dashed border-slate-300 pt-3">
                    <div className="grid grid-cols-[1.8fr_0.6fr_0.8fr_1fr] text-xs font-black text-slate-600 uppercase pb-2">
                      <span>Mặt hàng</span>
                      <span className="text-center">SL</span>
                      <span className="text-right">Đơn giá</span>
                      <span className="text-right">T.Tiền</span>
                    </div>
                    <div className="border-b border-slate-200"></div>

                    <div className="divide-y divide-slate-100">
                      {billPreviewData.items.map((item, idx) => {
                        const { name, spec } = splitProductSpec(item.name);
                        return (
                          <div key={item.id} className="py-3 space-y-1">
                            <div className="text-sm font-black text-slate-900 uppercase">
                              {idx + 1}. {name}
                            </div>
                            {spec && (
                              <span className="text-xs text-emerald-600 font-black italic block">
                                {spec}
                              </span>
                            )}
                            {item.discountPercent > 0 && (
                              <span className="inline-block text-[10px] bg-rose-50 text-rose-700 px-1 rounded font-bold">
                                Chiết khấu {item.discountPercent}% - còn {formatNumber(item.appliedPrice)}
                              </span>
                            )}
                            <div className="grid grid-cols-[1.8fr_0.6fr_0.8fr_1fr] text-xs font-bold text-slate-600 items-center">
                              <span className="italic text-[10px] text-slate-400">
                                {item.note ? `📝 ${item.note}` : ""}
                              </span>
                              <span className="text-center font-extrabold text-slate-900">
                                x{item.qty}
                              </span>
                              <span className="text-right">
                                {formatNumber(item.originalPrice)}
                              </span>
                              <span className="text-right font-black text-slate-900 text-sm">
                                {formatNumber(item.appliedPrice * item.qty)}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* Tổng tiền */}
                  <div className="border-t-2 border-dashed border-slate-300 py-4 mt-2 space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="text-lg font-black text-slate-800">TỔNG TIỀN THANH TOÁN:</span>
                      <span className="text-3xl font-black text-slate-950 italic">
                        {formatCurrency(billPreviewData.total)}
                      </span>
                    </div>
                  </div>

                  {/* Chuyển khoản VietQR */}
                  {settings.qrAccountNo && (
                    <div className="my-4 p-4 border border-slate-200 rounded-2xl flex flex-col items-center bg-slate-50 space-y-2">
                      <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        Quét mã QR VietQR chuyển khoản nhanh
                      </span>
                      <img
                        src={`https://img.vietqr.io/image/${settings.qrBankName.replace(/\s+/g, "")}-${settings.qrAccountNo}-compact2.png?amount=${billPreviewData.total}&addInfo=THANH%20TOAN%20${generateOrderCode(billPreviewData.id)}&accountName=${encodeURIComponent(settings.qrAccountName)}`}
                        alt="Mã QR thanh toán"
                        className="w-36 h-36 object-contain border-2 border-white rounded-lg bg-white shadow-sm"
                      />
                      <div className="text-center">
                        <p className="text-xs font-black text-slate-800 uppercase">{settings.qrBankName}</p>
                        <p className="text-xs font-bold text-slate-600">STK: {settings.qrAccountNo}</p>
                        <p className="text-[10px] font-bold text-slate-500">Chủ tài khoản: {settings.qrAccountName}</p>
                      </div>
                    </div>
                  )}

                  {/* Chân trang cảm ơn */}
                  <div className="text-center pt-4 border-t border-slate-100 space-y-1">
                    <p className="text-xs font-black uppercase tracking-widest text-slate-600">
                      Xin cảm ơn quý khách!
                    </p>
                    <p className="text-[10px] font-bold text-slate-400 italic">
                      Chúc quý khách vạn sự như ý và dồi dào sức khỏe!
                    </p>
                  </div>
                </div>

                <div className="receipt-serrated-bottom"></div>
              </div>
            )}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
